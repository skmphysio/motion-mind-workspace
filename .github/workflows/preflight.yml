name: Release preflight

# Read-only. Publishes NOTHING. Run this by hand before tagging a release.
#
# The first publication of a package name is a one-shot: npm unpublish is
# unavailable after 72 hours and harmful before it, so a wrong credential or a
# blocked job burns a version number that can never be reused. `npm publish
# --dry-run` cannot help — it never contacts the registry, so it cannot tell a
# good credential from a bad one.
#
# TWO INDEPENDENT JOBS, deliberately not chained, because a release needs both
# and they fail for unrelated reasons:
#
#   credential       — no environment, so it sees repository-level secrets and
#                      runs even when an environment gate would reject it.
#   environment-gate — the same protected environment `release.yml` uses. If
#                      this job cannot start, neither can a release, whatever
#                      the credential says.
#
# Neither ever prints the token: only whether it exists, and which npm account
# it belongs to — both already public facts about any successful release.

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write   # same identity the release job requests

jobs:
  credential:
    name: Credential
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Which publish path would a release take
        id: mode
        env:
          BOOTSTRAP: ${{ secrets.NPM_BOOTSTRAP_TOKEN }}
        run: |
          NAME=$(node -p "require('./package.json').name")
          VER=$(node -p "require('./package.json').version")
          echo "package     : $NAME@$VER"
          echo "scope       : ${NAME%%/*}"
          echo "expected tag: v$VER"
          {
            echo "name=$NAME"
            echo "scope=${NAME%%/*}"
            echo "version=$VER"
          } >> "$GITHUB_OUTPUT"
          if [ -n "$BOOTSTRAP" ]; then
            echo "NPM_BOOTSTRAP_TOKEN: PRESENT as a repository secret — release takes the BOOTSTRAP path"
            echo "mode=bootstrap" >> "$GITHUB_OUTPUT"
          else
            echo "NPM_BOOTSTRAP_TOKEN: not visible to a job without an environment."
            echo "  Either it is absent, or it is scoped to an environment rather"
            echo "  than the repository — the environment-gate job distinguishes these."
            echo "mode=oidc" >> "$GITHUB_OUTPUT"
          fi

      # Catches a token that is expired, revoked, or on the wrong account —
      # before a tag exists, rather than after a version is spent.
      - name: Is the bootstrap credential usable
        if: steps.mode.outputs.mode == 'bootstrap'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_BOOTSTRAP_TOKEN }}
        run: |
          if ! WHO=$(npm whoami 2>&1); then
            echo "::error::NPM_BOOTSTRAP_TOKEN did not authenticate: $WHO"
            exit 1
          fi
          echo "authenticated as npm account: $WHO"
          echo "::notice::Token authenticates as $WHO and must hold read-and-write on ${{ steps.mode.outputs.scope }}."

      - name: Has this version already been published
        run: |
          NAME='${{ steps.mode.outputs.name }}'
          VER='${{ steps.mode.outputs.version }}'
          if npm view "$NAME@$VER" version >/dev/null 2>&1; then
            echo "::error::$NAME@$VER already exists on the registry. Bump the version; a published version is never reused."
            exit 1
          fi
          echo "$NAME@$VER is not on the registry — free to publish."

      - name: Reminder
        run: |
          echo "Preflight only. Nothing was published."
          echo "A release happens solely by pushing the tag v${{ steps.mode.outputs.version }}."

  # Separate job on purpose: this is the only thing that proves a release job
  # can actually START. An environment protection rule rejects a job before any
  # runner is allocated — no steps, no logs, nothing to diagnose from — so it is
  # worth discovering here rather than on the tag.
  environment-gate:
    name: Environment gate
    runs-on: ubuntu-latest
    environment: npm-publish
    steps:
      - name: The release job can enter npm-publish
        env:
          BOOTSTRAP: ${{ secrets.NPM_BOOTSTRAP_TOKEN }}
        run: |
          echo "Entered the npm-publish environment; a release job would start."
          if [ -n "$BOOTSTRAP" ]; then
            echo "NPM_BOOTSTRAP_TOKEN: visible in this environment."
          else
            echo "NPM_BOOTSTRAP_TOKEN: NOT visible in this environment."
          fi
