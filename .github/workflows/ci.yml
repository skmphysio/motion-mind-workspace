name: CI

on:
  push: { branches: [main] }
  pull_request:

permissions:
  contents: read

jobs:
  gates:
    name: Enforced gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Caching is fine here. It is disabled only in the release job.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # The SAME command the release job runs, so nothing can pass CI and then
      # fail at publish time — or publish without having been checked.
      - name: Gates
        run: npm run gates

  consumers:
    name: Consumers (npm + bun, React 18 + 19) and lazy loading
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: oven-sh/setup-bun@v2
      - run: npm ci
      # Assert bun before the matrix, so a runner without it fails with a clear
      # message rather than an opaque spawn error deep inside the probe.
      - name: Assert bun
        run: node scripts/assert-bun.mjs
      - run: npm run build
      # Peer ranges must satisfy npm's resolver, not only bun's: bun warns where
      # npm fails, so a bun-only check would let Motion Mind's install break
      # while Campus stayed green. Both managers, both React majors.
      - run: npm run verify:consumers
      # One package is only safe if the heavy areas still split out.
      - run: npm run verify:lazy
