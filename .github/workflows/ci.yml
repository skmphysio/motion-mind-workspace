name: CI

on:
  push: { branches: [main] }
  pull_request:

permissions:
  contents: read

jobs:
  gates:
    name: Enforced gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Caching is fine here. It is disabled only in the release job.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      # The SAME command the release job runs, so nothing can pass CI and then
      # fail at publish time — or worse, publish without having been checked.
      #   build · Campus tsconfig · Motion Mind tsconfig · tests
      #   · published contents · publint · attw
      - name: Gates
        run: npm run gates

  consumers:
    name: Exact-version install (npm + bun)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: oven-sh/setup-bun@v2
      - run: npm ci
      - run: npm run build
      # Installs the packed tarball in both package managers and runs a
      # behaviour smoke test through each resolver. Peer ranges must satisfy
      # npm's stricter resolver, not only bun's — bun accepts peer mismatches
      # npm rejects, so a bun-only check would let Motion Mind's npm install
      # break while Campus stayed green.
      - run: node scripts/verify-consumers.mjs
