name: Release

# Publishing happens ONLY here, only from a tag, on a GitHub-hosted runner.
#
# npm's trusted publishing (OIDC) requires a recent npm, so the job runs Node 24
# and asserts npm >= 11.5.1 before anything else — an old toolchain fails loudly
# rather than silently publishing without provenance.
#
# `publishConfig.provenance: true` additionally makes `npm publish` FAIL outside
# a supported CI provider ("Automatic provenance generation not supported for
# provider: null"), verified during the PR-0 rehearsal. That refusal is the
# protection: never pass --provenance=false here.

on:
  push:
    # BOTH tag forms. `0.0.0-alpha.1` was pushed without the `v` and this
    # workflow, listening only for `v*`, never fired: no run, no failure, no
    # signal at all — the worst way for a release to not happen. The tag form is
    # not a safety property; the version-match step below is, and it already
    # strips a leading `v`.
    tags: ['v[0-9]*', '[0-9]*']

permissions:
  contents: read
  id-token: write   # required for OIDC trusted publishing and provenance

jobs:
  publish:
    runs-on: ubuntu-latest          # GitHub-hosted: required for trusted publishing
    environment: npm-publish        # protected environment; reviewers set in repo settings
    steps:
      - uses: actions/checkout@v4

      # Package-manager caching is deliberately DISABLED in the release job, so
      # every publish resolves fresh with the toolchain asserted below.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Use an npm that supports trusted publishing
        run: |
          npm install -g npm@^11.5.1
          npm --version

      - name: Assert toolchain
        run: NPM_VERSION="$(npm --version)" node scripts/assert-release-toolchain.mjs

      - run: npm ci

      # The FULL enforced gate set runs again on the exact tagged commit —
      # build, both tsconfigs, tests, boundaries, contents, publint, attw.
      # A release never trusts an earlier green run.
      - name: Gates
        run: npm run gates

      # The consumer matrix runs the same probe through npm AND bun, so the
      # release job needs bun exactly as the CI consumers job does. A
      # GitHub-hosted runner does NOT preinstall it: without this step the
      # release died inside the matrix, after every other gate had passed and
      # immediately before publishing. Same pinned action as CI.
      - uses: oven-sh/setup-bun@v2

      - name: Assert bun
        run: node scripts/assert-bun.mjs

      - name: Consumer verification (npm + bun, React 18 + 19)
        run: npm run verify:consumers

      # npm 11 REFUSES to publish a prerelease without an explicit --tag; npm 10
      # guessed `latest` and exited 0. Deriving the tag from the version means
      # there is no hand-maintained `--tag alpha` to forget at 1.0.0, and no way
      # to put a prerelease where a plain `npm install` would find it.
      - name: Resolve the dist-tag from the package version
        id: disttag
        run: |
          TAG=$(node scripts/resolve-dist-tag.mjs)
          echo "publishing under dist-tag: $TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Verify the tag matches the package version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VER=$(node -p "require('./package.json').version")
          if [ "$TAG" != "$VER" ]; then
            echo "Tag $TAG does not match package version $VER"; exit 1
          fi
          echo "tag $TAG matches package version $VER"

      # ── TWO EXPLICIT PUBLISH PATHS, selected by whether the bootstrap secret
      # exists. They are separate steps on purpose: an empty NODE_AUTH_TOKEN is
      # NOT a reliable signal to npm that it should fall back to OIDC, so the
      # OIDC path must run with no auth token variable present at all.
      - name: Detect publish mode
        id: mode
        env:
          BOOTSTRAP: ${{ secrets.NPM_BOOTSTRAP_TOKEN }}
        run: |
          if [ -n "$BOOTSTRAP" ]; then
            echo "mode=bootstrap" >> "$GITHUB_OUTPUT"
            echo "::warning::Publishing with the BOOTSTRAP TOKEN. After this release: configure trusted publishing, delete the NPM_BOOTSTRAP_TOKEN secret, and REVOKE the token on npm."
          else
            echo "mode=oidc" >> "$GITHUB_OUTPUT"
          fi

      # FIRST PUBLICATION ONLY. Trusted publishing is configured in npm's
      # PACKAGE settings, which do not exist until the package does — so the
      # very first publish of a new name cannot use OIDC.
      - name: Publish (bootstrap token, first publication only)
        if: steps.mode.outputs.mode == 'bootstrap'
        run: npm publish --access public --tag '${{ steps.disttag.outputs.tag }}'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_BOOTSTRAP_TOKEN }}

      # THE PERMANENT PATH. No NODE_AUTH_TOKEN is set for this step at all;
      # npm exchanges the job's OIDC identity for a short-lived credential.
      - name: Publish (OIDC trusted publishing, permanent path)
        if: steps.mode.outputs.mode == 'oidc'
        run: npm publish --access public --tag '${{ steps.disttag.outputs.tag }}'

      - name: Release-age reminder
        run: |
          echo "Published. Campus's bunfig minimumReleaseAge=86400 blocks this"
          echo "version for 24 hours — verified in PR-0. Do not open the Campus"
          echo "adoption PR until then; bun install will hard-fail."
